name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint・整形・型検査・単体テスト（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # MCP サーバーは、Claude Code を起動した場所で asdf が選ぶ Node で動く（machosterone と hikeshi では 25.9.0）
        node: ['24.2.0', '25.9.0']
    steps:
      # アクションは供給網攻撃への対策として、タグではなくコミットの SHA に固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix plugin
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
